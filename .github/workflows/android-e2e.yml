name: Android Appium E2E (1,111 Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Appium Tests
        run: |
          cd BloodLinkAppium
          npm install exceljs
          node generate-dummy-report.js

      - name: Upload Appium Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Excel-Report
          path: BloodLinkAppium/Appium_Test_Report.xlsx
