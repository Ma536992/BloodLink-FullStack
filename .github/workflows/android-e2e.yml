name: Android Appium E2E (1,111 Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Install Appium
        run: npm install -g appium@next

      - name: Run Appium UI Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 29
          target: default
          arch: x86
          profile: Nexus 6
          script: |
            adb install -r $APK_PATH
            appium --log-level warn > /tmp/appium.log 2>&1 &
            sleep 10
            bash BloodLinkAppium/scripts/ci_run_tests.sh

      - name: Upload Appium Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Excel-Report
          path: BloodLinkAppium/Selenium_Appium_Report.xlsx
