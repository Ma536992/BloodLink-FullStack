name: Android Appium E2E & GitHub Pages Reports

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            appium --log-level error & 
            sleep 30
            ./gradlew :testing:test

      - name: Prepare Reports for GitHub Pages
        if: always()
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}
          
          # Copy HTML Report
          cp -r testing/Test-Results/HTML/* public/reports/latest/
          cp -r testing/Test-Results/HTML/* public/reports/history/build-${{ github.run_number }}/
          
          # Copy Screenshots
          cp -r testing/Test-Results/Screenshots public/reports/latest/
          cp -r testing/Test-Results/Screenshots public/reports/history/build-${{ github.run_number }}/
          
          # Copy Summary
          cp testing/Test-Results/Summary/summary.md public/reports/latest/
          cp testing/Test-Results/Summary/summary.md public/reports/history/build-${{ github.run_number }}/

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Test-Results
          path: testing/Test-Results/

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Job Summary
        if: always()
        run: cat testing/Test-Results/Summary/summary.md >> $GITHUB_STEP_SUMMARY
