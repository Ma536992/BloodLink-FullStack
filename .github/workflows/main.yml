name: BloodLink Full-Stack CI

on:
  push:
    branches: [ main ]

jobs:
  web-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and Deploy
        run: |
          cd web
          npm install
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINK_BLOOD_BDAAD }}'
          projectId: link-blood-bdaad
          channelId: live

  appium-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # This will save 3-5 minutes on every build

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Run E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25 # Fastest loading version
          target: default
          arch: x86
          profile: Nexus 6
          script: |
            appium & 
            sleep 10
            ./gradlew :testing:test
          
      - name: Upload Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Excel-Report
          path: testing/TestReport_Analysis.xlsx
